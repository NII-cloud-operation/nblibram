[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nblibram"
dynamic = ["version"]
description = "Query, edit, and sanitize Jupyter notebooks from the shell"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Programming Language :: Go",
]

[project.urls]
Homepage = "https://github.com/NII-cloud-operation/nblibram"
Repository = "https://github.com/NII-cloud-operation/nblibram"
Issues = "https://github.com/NII-cloud-operation/nblibram/issues"

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
